services:
  postgres:
    image: postgres:16-alpine
    container_name: codeftc-postgres
    restart: unless-stopped
    ports:
      - "3311:5432"
    environment:
      POSTGRES_USER: codeftc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: codeftc
    volumes:
      - codeftc_postgres_data:/var/lib/postgresql/data

  ftc-java-sandbox:
    image: docker.bedson.tech/codeftc-java-sandbox:latest
    pull_policy: always
    entrypoint: ["true"]
    restart: "no"

  nextjs:
    image: docker.bedson.tech/tbedson/codeftc-nextjs:latest
    container_name: codeftc-nextjs
    restart: unless-stopped
    ports:
      - "3310:3000"
    env_file:
      - .env.prod
    environment:
      EXEC_TMP_DIR: /tmp/codeftc-exec
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/codeftc-exec:/tmp/codeftc-exec
    depends_on:
      postgres:
        condition: service_started

volumes:
  codeftc_postgres_data:
