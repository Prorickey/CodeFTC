services:
  postgres:
    image: postgres:16-alpine
    container_name: codeftc-postgres
    environment:
      POSTGRES_USER: codeftc
      POSTGRES_PASSWORD: codeftc_dev
      POSTGRES_DB: codeftc
    ports:
      - "5432:5432"
    volumes:
      - codeftc_postgres_data:/var/lib/postgresql/data

volumes:
  codeftc_postgres_data:
