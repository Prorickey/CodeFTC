# Rate limit zones (must be in http context — this file is included inside http{})
# auth: 10 req/min per IP — brute-force protection on sign-in endpoints
limit_req_zone $binary_remote_addr zone=auth:10m     rate=10r/m;
# api: 20 req/min per IP — code execution and analytics APIs
limit_req_zone $binary_remote_addr zone=api:10m      rate=20r/m;
# general: 30 req/s per IP — normal browsing
limit_req_zone $binary_remote_addr zone=general:10m  rate=30r/s;

# Return 429 Too Many Requests instead of the default 503
limit_req_status 429;

server {
    listen 80;
    server_name codeftc.roboknights.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name codeftc.roboknights.net;

    ssl_certificate     /etc/letsencrypt/live/codeftc.roboknights.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codeftc.roboknights.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    # Auth endpoints — strict limit, no burst, to block credential stuffing
    location /api/auth/ {
        limit_req zone=auth nodelay;
        proxy_pass         http://localhost:3310;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /auth/ {
        limit_req zone=auth nodelay;
        proxy_pass         http://localhost:3310;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Code execution analytics API — moderate limit
    location /api/analytics/run {
        limit_req zone=api burst=5 nodelay;
        proxy_pass         http://localhost:3310;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Everything else — general limit with generous burst for normal browsing
    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass         http://localhost:3310;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
